[project]
name = "mcp-ops-atlas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ivan Djoko", email = "kamdemdjokoivan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.122",
